[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests que requieren servicios externos (DB, APIs)
    unit: tests unitarios que no requieren dependencias
