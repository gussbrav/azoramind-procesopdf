<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado morado -->
  <rect width="32" height="32" rx="7" fill="#7c3aed"/>
  <!-- Palo central -->
  <rect x="15.2" y="6" width="1.6" height="18" rx="0.8" fill="white"/>
  <!-- Base -->
  <rect x="10.5" y="23.5" width="11" height="2" rx="1" fill="white"/>
  <!-- Barra horizontal -->
  <rect x="7" y="10" width="18" height="1.5" rx="0.75" fill="white"/>
  <!-- Cadenas platillo izquierdo -->
  <rect x="9.2" y="11.5" width="1" height="4" rx="0.5" fill="#e9d5ff"/>
  <rect x="11.2" y="11.5" width="1" height="4" rx="0.5" fill="#e9d5ff"/>
  <!-- Platillo izquierdo -->
  <path d="M8 15.5 Q10.2 18 12.4 15.5" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Cadenas platillo derecho -->
  <rect x="19.8" y="11.5" width="1" height="4" rx="0.5" fill="#e9d5ff"/>
  <rect x="21.8" y="11.5" width="1" height="4" rx="0.5" fill="#e9d5ff"/>
  <!-- Platillo derecho -->
  <path d="M19.6 15.5 Q21.8 18 24 15.5" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Punto pivote central -->
  <circle cx="16" cy="10.75" r="1.2" fill="white"/>
</svg>
